# Pre-Commit-Hooks für AIMA. Installation:
#   uv run pre-commit install   (installiert pre-commit + commit-msg dank default_install_hook_types)
#
# Alle Hooks laufen über `uv run` gegen das Projekt-venv → identisch zu CI,
# eine einzige Quelle der Wahrheit für Tool-Versionen (pyproject [dependency-groups]).
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy (strict)
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types: [python]

      - id: commitizen
        name: commitizen (conventional commits)
        entry: uv run cz check --commit-msg-file
        language: system
        stages: [commit-msg]
